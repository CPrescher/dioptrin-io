[package]
name = "dioptrin-io-eiger-bench"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
dioptrin-io = { path = "../..", features = ["hdf5"] }
dioptrin = { path = "../../../Dioptrin-io-adapter", features = ["native-input"] }
