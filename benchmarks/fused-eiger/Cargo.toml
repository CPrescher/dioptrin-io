[package]
name = "fused-eiger-bench"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
dioptrin-io = { path = "../..", features = ["hdf5"] }
# Supply the implementing Dioptrin checkout with --config patch.crates-io.dioptrin.path=...
dioptrin = "=0.12.0"
rayon = "1.12"
serde_json = "1"
sha2 = "0.10"
bytemuck = "1"

[profile.release]
lto = true
codegen-units = 1
