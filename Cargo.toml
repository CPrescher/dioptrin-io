[package]
name = "dioptrin-io"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Native detector-image input shared by diffraction applications"
repository = "https://github.com/CPrescher/dioptrin-io"
readme = "README.md"

[features]
default = []
hdf5 = ["dep:hdf5-backend", "dep:hdf5-sys", "dep:hdf5-bitshuffle", "dep:libz-sys", "dep:lz4_flex", "dep:bytemuck"]
tiff = ["dep:tiff-backend"]
cbf = ["dep:md-5"]
edf = ["dep:bytemuck", "dep:flate2", "dep:bzip2", "dep:tempfile"]
native = ["dep:bytemuck"]
xsd = ["native", "dep:roxmltree", "dep:data-encoding", "dep:md-5"]
containers = ["native", "dep:roxmltree", "dep:mrc-backend"]
wrappers = ["native", "tiff", "cbf", "edf", "dep:tempfile"]

[dependencies]
hdf5-backend = { package = "hdf5-metno", version = "=0.15.1", optional = true, features = ["static", "zlib", "lzf"] }
hdf5-sys = { package = "hdf5-metno-sys", version = "=0.12.5", optional = true }
hdf5-bitshuffle = { version = "=1.0.0", optional = true }
libz-sys = { version = "1.1", optional = true, features = ["static"] }
lz4_flex = { version = "=0.14.0", optional = true, default-features = false, features = ["std", "safe-decode", "checked-decode"] }
bytemuck = { version = "1.24", optional = true }
tiff-backend = { package = "tiff", version = "=0.11.3", optional = true, default-features = false, features = ["deflate", "lzw"] }
md-5 = { version = "0.10", optional = true }
flate2 = { version = "1.1", optional = true, default-features = false, features = ["rust_backend"] }
bzip2 = { version = "0.6", optional = true }
tempfile = { version = "3.27", optional = true }
roxmltree = { version = "=0.21.2", optional = true }
mrc-backend = { package = "mrc", version = "=0.8.0", optional = true, default-features = false }

data-encoding = { version = "=2.11.1", optional = true }

[dev-dependencies]
tempfile = "3.27"
sha2 = "0.10"
serde_json = "1.0"

[[example]]
name = "inspect_frames"
required-features = ["hdf5"]

[[example]]
name = "parity_probe"
required-features = ["wrappers"]
