[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "dioptrin-io"
version = "0.2.1"
description = "Native detector-file readers returning original counts as NumPy arrays"
authors = [{ name = "Clemens Prescher" }]
readme = "python/README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/**/*", "vendor/**/LICENSE*", "native/**/LICENSE*"]
dependencies = ["numpy>=2,<3"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/CPrescher/dioptrin-io"
Documentation = "https://dioptrin-io.readthedocs.io/en/latest/PYTHON_API.html"
Issues = "https://github.com/CPrescher/dioptrin-io/issues"

[project.optional-dependencies]
test = ["pytest>=8", "h5py>=3.11", "tifffile>=2024.1.30"]

[tool.maturin]
manifest-path = "python/Cargo.toml"
python-source = "python"
python-packages = ["dioptrin_io", "dioptrin_io_fused"]
module-name = "dioptrin_io._native"
features = ["pyo3/extension-module"]
include = [{ path = "python/tests/**", format = "sdist" }, { path = "python-fused/src/bridge.rs", format = "sdist" }, { path = "python-fused/tests/**", format = "sdist" }, { path = "tests/data/counts-bitshuffle-lz4.*", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
