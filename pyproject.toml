[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "dioptrin-io"
version = "0.1.0"
description = "Native detector-file readers returning original counts as NumPy arrays"
readme = "python/README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/**/*", "vendor/**/LICENSE*", "native/**/LICENSE*"]
dependencies = ["numpy>=2,<3"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/CPrescher/dioptrin-io"

[project.optional-dependencies]
test = ["pytest>=8", "h5py>=3.11", "tifffile>=2024.1.30"]

[tool.maturin]
manifest-path = "python/Cargo.toml"
python-source = "python"
module-name = "dioptrin_io._native"
features = ["pyo3/extension-module"]
include = [{ path = "python/tests/**", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
