name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful Python release wheels run for this exact commit
        type: string
        required: true
      release_tag:
        description: Existing Python release tag, e.g. python-v0.1.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: pypi-publication
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Verify source run and release tag
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import json, os, subprocess, tomllib
          run_id = os.environ['ARTIFACT_RUN_ID']
          assert run_id.isdecimal()
          repository = os.environ['GITHUB_REPOSITORY']
          run = json.loads(subprocess.check_output(['gh','api',f'repos/{repository}/actions/runs/{run_id}']))
          assert run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['GITHUB_SHA']
          assert run['path'] == '.github/workflows/python-release.yml'
          assert run['event'] in ('push','workflow_dispatch')
          version = tomllib.load(open('pyproject.toml','rb'))['project']['version']
          tag = os.environ['RELEASE_TAG']
          assert tag == 'python-v' + version
          assert subprocess.check_output(['git','rev-list','-n','1',tag], text=True).strip() == run['head_sha']
          print('Verified tested source commit:',run['head_sha'])
          PY
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          pattern: pypi-*
          merge-multiple: true
          path: dist
      - run: python -m pip install twine packaging
      - run: python scripts/check_release_artifacts.py dist
      - run: python scripts/check_python_distribution.py dist
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/dioptrin-io/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: verified-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
