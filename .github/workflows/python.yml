name: Python package

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: python -m pip install "maturin>=1.9,<2"
      - name: Linux wheel repair tooling
        if: runner.os == 'Linux'
        run: python -m pip install patchelf
      - run: cargo fmt --manifest-path python/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path python/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo check --locked --manifest-path python/Cargo.toml --no-default-features
      - run: maturin build --locked --release --out dist
      - run: python -m pip install --no-index --no-deps --find-links dist dioptrin-io
      - run: python -m pip install "numpy>=2,<3" "pytest>=8" "h5py>=3.11" "tifffile>=2024.1.30"
      - run: python -m pytest
      - run: python scripts/check_python_distribution.py dist
      - name: Build and inspect source distribution
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: maturin sdist --out dist
      - name: Rebuild wheel from source distribution outside checkout
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python scripts/check_python_distribution.py dist --rebuild
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
