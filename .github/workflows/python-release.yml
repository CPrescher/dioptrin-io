name: Python release wheels

on:
  push:
    branches: [codex/python-pypi-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
            target: x86_64
            image: quay.io/pypa/manylinux_2_28_x86_64:latest
            versions: "3.10 3.11 3.12 3.13 3.14 3.15"
          - os: ubuntu-24.04-arm
            name: linux-aarch64
            target: aarch64
            image: quay.io/pypa/manylinux_2_28_aarch64:latest
            versions: "3.10 3.11 3.12 3.13 3.14 3.15"
          - os: macos-15-intel
            name: macos-x86_64
            versions: "3.10 3.11 3.12 3.13 3.14 3.15"
          - os: macos-15
            name: macos-arm64
            versions: "3.10 3.11 3.12 3.13 3.14 3.15"
          - os: windows-latest
            name: windows-x86_64
            versions: "3.10 3.11 3.12 3.13 3.14 3.15"
          - os: windows-11-arm
            name: windows-arm64
            versions: "3.13 3.14 3.15"
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: python -m pip install "maturin>=1.9,<2" uv twine
      - name: Portable Linux wheels
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          container: ${{ matrix.image }}
          args: --locked --release --out dist --compatibility manylinux_2_28 -i python3.10 python3.11 python3.12 python3.13 python3.14 python3.15
      - name: Test portable Linux wheels
        if: runner.os == 'Linux'
        run: python scripts/python_wheels.py --versions ${{ matrix.versions }}
      - name: Build and test native macOS/Windows wheels
        if: runner.os != 'Linux'
        run: python scripts/python_wheels.py --build --versions ${{ matrix.versions }}
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_python_distribution.py dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pypi-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: python -m pip install "maturin>=1.9,<2" twine patchelf
      - run: maturin build --locked --release --out dist
      - run: maturin sdist --out dist
      - run: python scripts/check_python_distribution.py dist --rebuild
      - run: python -m twine check --strict dist/*.tar.gz
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pypi-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
