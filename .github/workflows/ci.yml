name: Rust

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: rustc -Vv
      - name: Check MSVC SIMD source compatibility
        if: startsWith(matrix.os, 'windows')
        run: python scripts/check_msvc_codec.py
      - run: cargo fmt --check
      - run: cargo check --locked --no-default-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features --no-fail-fast
      - name: Report and verify native Bitshuffle backend
        run: cargo test --locked --features hdf5 --test bitshuffle_neon linked_backend -- --nocapture
      - run: python scripts/check_consumer.py --all-features

  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python scripts/inventory_fabio.py --check
      - run: python -m unittest discover -s scripts -p test_inventory_fabio.py
      - run: python -m unittest discover -s scripts -p test_report_codec_ci.py
