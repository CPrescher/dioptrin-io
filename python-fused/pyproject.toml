[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "dioptrin-io-fused"
version = "0.1.0"
description = "Source-build adapter for fixed-mask Dioptrin and dioptrin-io integration"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3"]
license = "MIT"
license-files = ["LICENSE", "licenses/**/*"]

[tool.maturin]
module-name = "dioptrin_io_fused"
