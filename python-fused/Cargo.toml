[package]
name = "dioptrin-io-fused-python"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
name = "dioptrin_io_fused"
crate-type = ["cdylib"]

[dependencies]
dioptrin-io = { path = "..", features = ["hdf5"] }
dioptrin = { git = "https://github.com/CPrescher/Dioptrin", rev = "0501406b24a122bd9468cb2f63ddf33bba3c85bc", version = "=0.10.0" }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }

[profile.release]
lto = true
codegen-units = 1
